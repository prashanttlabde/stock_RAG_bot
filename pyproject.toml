[project]
name = "mf-faq-rag-chatbot"
version = "0.1.0"
description = "Facts-only RAG chatbot for HDFC mutual fund scheme pages"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data/chroma"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# RUF001-003 flag en dashes and similar glyphs. Both are deliberate here: the
# scheme display names use "–", and clean_text strips " -–—" from line edges.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
